<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Management System Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#202b3c;background:#f4f6fa}.app{display:flex;min-height:100vh}.side{width:235px;background:#172b4d;color:white;padding:22px 14px}.brand{font-size:17px;font-weight:bold;padding:5px 10px 24px}.brand small{display:block;font-size:10px;font-weight:normal;color:#bac8dc;margin-top:7px}.nav{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:7px;margin:3px 0;background:transparent;color:#e5ecf6;cursor:pointer;font-size:13px}.nav:hover,.nav.active{background:#ffffff20}.main{flex:1;min-width:0}.top{background:white;padding:22px 28px;border-bottom:1px solid #e0e5ed;display:flex;justify-content:space-between}.top small{color:#718096}.content{padding:26px;max-width:1400px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.heading h2{margin:0 0 6px}.muted{color:#718096}.btn{border:0;background:#2855a6;color:white;border-radius:7px;padding:11px 14px;cursor:pointer;font-weight:bold}.notice{background:#edf4ff;border:1px solid #d8e6ff;border-radius:8px;padding:12px;margin-bottom:18px;color:#34517e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:white;border:1px solid #e1e6ee;border-radius:10px;padding:18px;margin-bottom:18px}.stat-label{color:#718096;font-size:12px}.stat-value{font-size:25px;font-weight:bold;margin:13px 0}.row{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{background:white;border:1px solid #dfe5ee;border-radius:8px;padding:14px;text-align:left;cursor:pointer}.quick small{display:block;color:#718096;margin-top:6px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #e9edf3;font-size:12px}th{background:#f8faff;color:#718096}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d5dce7;border-radius:7px}.footer{text-align:center;color:#8993a3;font-size:11px;padding:8px}@media(max-width:800px){.side{width:190px}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.side{width:100%}.stats{grid-template-columns:1fr 1fr}.content{padding:14px}.top{padding:15px}.form{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">ERP Management System<small>Production · Inventory · Sales · Finance</small></div>
<button class="nav active" data-page="Dashboard">▦ &nbsp; Dashboard</button><button class="nav" data-page="Inventory">▤ &nbsp; Inventory & Store</button><button class="nav" data-page="Production">⚙ &nbsp; Production</button><button class="nav" data-page="Sales">▧ &nbsp; Sales & POS</button><button class="nav" data-page="Customers">♙ &nbsp; Customers</button><button class="nav" data-page="Suppliers">♧ &nbsp; Suppliers</button><button class="nav" data-page="Finance">▱ &nbsp; Finance & Expenses</button><button class="nav" data-page="Scrap Management">♲ &nbsp; Scrap Management</button><button class="nav" data-page="Staff & Access">♙ &nbsp; Staff & Access</button><button class="nav" data-page="Reports">▥ &nbsp; Reports</button></aside>
<main class="main"><header class="top"><div><small>ERP / <span id="crumb">Dashboard</span></small><h3 id="title" style="margin:5px 0 0">Dashboard</h3></div><div>System User</div></header><div class="content" id="content"></div><div class="footer">Prototype interface · Not connected to a live database</div></main></div>
<script>
const pages={
"Dashboard":`<div class="heading"><div><h2>Operations overview</h2><span class="muted">Inventory, production, sales and finance at a glance.</span></div></div><div class="notice">Prototype mode: no live company data is connected. Use the menu to inspect each module.</div><div class="stats">${[['Raw material stock','—','White sheets · Black sheets · Steel rods'],['Production output','—','Recorded finished products'],['Sales & invoices','—','Sales and outstanding balances'],['Finance','—','Payments and expenses']].map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div><div class="row"><section class="card"><h3>Recent activity</h3><p class="muted">No activity records yet. Activity appears when implemented.</p></section><section class="card"><h3>Quick access</h3><div class="quick"><button onclick="go('Inventory')"><b>Receive materials</b><small>Delivery note and supplier</small></button><button onclick="go('Production')"><b>Record production</b><small>Materials and actual output</small></button><button onclick="go('Sales')"><b>Record a sale</b><small>Customer, invoice, payment</small></button><button onclick="go('Finance')"><b>Record expense</b><small>Category, date, method</small></button></div></section></div>`,
"Inventory":module("Inventory & Store","Receive raw materials, track stock quantities and units, issue materials, and receive finished products.",["Transaction type","Material / product","Specification","Quantity","Unit","Supplier","Delivery note","Payment status"],["White Sheet","14 / 16 / 18 Gauge","KG","Black Sheet — 2mm, 4mm, 5mm, 6mm","10mm Steel Rod"]),
"Production":module("Production","Request materials, record materials used, actual output and scrap.",["Product","Size","Raw material","Quantity used","Expected output","Actual output","Technician","Date"],["Sliding Handles — Small / Medium / Large","Window Stay","Down Stopper","Center Stopper","Window Fastener","Window Hinges — ¾ / 1 inch","Door Konji","Flat Bushes — ¾ / 1 / 1¼ inch","¾ inch Flat Bush / 4mm Black Sheet: 700","¾ inch Flat Bush / 10mm Rod: 140","1 inch Flat Bush / 6mm Black Sheet: 600–625","1 inch Flat Bush / 10mm Rod: 140","1¼ inch Flat Bush / 5mm Black Sheet: 513","1¼ inch Flat Bush / 4mm Black Sheet: 700","1¼ inch Flat Bush / 10mm Rod: 120"]),
"Sales":module("Sales & POS","Record sales, invoices, credit sales and customer requests for unavailable products.",["Invoice number","Customer","Product","Quantity","Unit price","Payment status","Turnaround time"],["Customer","Product","Quantity","Unit price","Payment method","Paid / Credit","Unavailable product request"]),
"Customers":module("Customers","Maintain customer profiles, sales and payment history, and outstanding balances.",["Customer","Contact details","Sales history","Payment history","Outstanding balance"],["Customer name","Contact details","Address","Notes"]),
"Suppliers":module("Suppliers","Maintain supplier profiles, supplied materials, purchase history and payments.",["Supplier","Contact details","Materials supplied","Purchase history","Payment status"],["Supplier name","Contact details","Materials supplied","Payment terms","Notes"]),
"Finance":module("Finance & Expenses","Track invoices, customer payments, supplier payments, expenses and financial approvals.",["Record type","Category","Date","Payment method","Amount","Status"],["Invoice / payment / expense","In-house / External","Date","Payment method","Amount","Approval status"]),
"Scrap Management":module("Scrap Management","Record scrap from sheets and rods, including weight, source, date, buyer and money received.",["Source","Weight (KG)","Date","Buyer","Selling price","Amount received"],["Sheet / Rod","Weight (KG)","Date","Buyer","Selling price","Amount received"]),
"Staff & Access":module("Staff & Access","Maintain staff profiles, role-based permissions and activity history.",["Staff member","Role","Permissions","Activity history"],["Administrator","Finance","Technician","Store","Salesperson"]),
"Reports":`<div class="heading"><div><h2>Reports</h2><p class="muted">Management visibility across the ERP modules.</p></div></div><div class="notice">Reports require verified records and implemented calculations.</div><div class="stats">${[['Inventory report','Stock quantities and movements'],['Production report','Materials used and output'],['Sales report','Invoices, credit and payments'],['Expense report','Categories and payment methods']].map(x=>`<div class="card"><b>${x[0]}</b><p class="muted">${x[1]}</p></div>`).join('')}</div>`
};
function module(title,desc,headers,options){return `<div class="heading"><div><h2>${title}</h2><span class="muted">${desc}</span></div><button class="btn" onclick="document.getElementById('form').scrollIntoView({behavior:'smooth'})">+ Add record</button></div><div class="notice">Prototype only: forms demonstrate required fields and do not save to a database.</div><section class="card"><h3>Records</h3><div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td colspan="${headers.length}" class="muted">No live records connected</td></tr></tbody></table></div></section><section class="card"><h3>Relevant fields / options</h3><p class="muted">${options.join(' · ')}</p></section><section class="card" id="form"><h3>Add record</h3><form class="form" onsubmit="event.preventDefault();alert('Prototype only: no record was saved.');">${headers.slice(0,6).map((x,i)=>`<div class="field"><label>${x}</label><input placeholder="Enter ${x.toLowerCase()}" ${i===0?'required':''}></div>`).join('')}<div><button class="btn" type="submit">Preview form action</button></div></form></section>`}
function go(p){document.getElementById('title').textContent=p;document.getElementById('crumb').textContent=p;document.getElementById('content').innerHTML=pages[p];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));go('Dashboard');
</script></body></html>
